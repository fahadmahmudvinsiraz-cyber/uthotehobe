<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>উঠতেই হবে</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--tx:#1f2937;--mu:#6b7280;--ac:#ea580c;--bd:#fed7aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1410;--card:#2a1d15;--tx:#fef3e8;--mu:#b8a090;--bd:#4a3225}}
:root[data-theme="dark"]{--bg:#1c1410;--card:#2a1d15;--tx:#fef3e8;--mu:#b8a090;--bd:#4a3225}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali",system-ui,sans-serif;min-height:100vh}
.s{display:none;padding:20px;max-width:480px;margin:0 auto;min-height:90vh;flex-direction:column}
.s.on{display:flex}
.c{align-items:center;justify-content:center;text-align:center;gap:14px}
.big{font-size:64px}
h1{margin:0;font-size:30px;color:var(--ac)}
p{color:var(--mu);margin:0;line-height:1.6}
button{font:inherit;border:0;border-radius:14px;padding:14px 22px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--mu);font-weight:500}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:9px;background:var(--bd)}.dots i.on{background:var(--ac);width:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.t{font-size:28px;font-weight:700}
.sub{font-size:13px;color:var(--mu)}
input[type=time]{font:inherit;font-size:34px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
.opt{display:block;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer}
.opt.on{border-color:var(--ac)}
.fab{margin-top:10px;width:100%}
.ring{background:var(--ac);color:#fff;text-align:center;align-items:center;justify-content:center;gap:12px}.ring p{color:#ffedd5}.ring .t{font-size:64px}
.ring button{background:#fff;color:var(--ac)}
video{width:100%;max-height:46vh;object-fit:cover;border-radius:16px;background:#000;transform:scaleX(-1)}
video.env{transform:none}
.cnt{font-size:72px;font-weight:800;color:var(--ac);text-align:center}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac)}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}.shake{animation:sh .4s infinite}
.row{display:flex;gap:10px;margin-top:18px}.row button{flex:1}
</style>
</head>
<body>

<div class="s c on" id="splash"><div class="big">⏰</div><h1>উঠতেই হবে</h1><p>ঘুমকে হারান, নিজের ইচ্ছায়</p></div>

<div class="s c" id="welcome">
 <div class="big" id="wi"></div><h1 id="wt" style="font-size:24px"></h1><p id="wd"></p>
 <div class="dots" id="dots"></div>
 <button id="wn">পরের</button>
</div>

<div class="s" id="home">
 <h1>আমার এলার্ম</h1><p>বন্ধ করতে হলে টাস্ক করতেই হবে</p>
 <div id="list"></div>
 <button class="g" id="test" style="margin-top:14px">🔔 পরীক্ষা: ৫ সেকেন্ডে বাজাও</button>
 <button class="fab" id="add">+ নতুন এলার্ম</button>
</div>

<div class="s" id="new">
 <h1 style="font-size:24px">নতুন এলার্ম</h1>
 <input type="time" id="tm" value="06:00">
 <p style="margin-top:16px">বন্ধ করতে কী করতে হবে?</p>
 <label class="opt on" data-k="pushup">💪 ১০টা পুশ-আপ<div class="sub">ক্যামেরা গুনবে</div></label>
 <label class="opt" data-k="tap">🚰 বাথরুমের ট্যাপের ছবি<div class="sub">লাইভ ছবি তুলতে হবে</div></label>
 <div class="row"><button class="g" id="cx">বাতিল</button><button id="sv">সংরক্ষণ</button></div>
</div>


<div class="s ring" id="ring"><div class="big shake">⏰</div><div class="t" id="rt">06:00</div><h1 style="color:#fff">উঠতেই হবে!</h1><p id="rd"></p><button id="rb">টাস্ক শুরু করুন</button></div>

<div class="s" id="task">
 <h1 style="font-size:22px" id="tk"></h1><p id="tp"></p>
 <video id="vd" autoplay playsinline muted style="margin-top:12px"></video>
 <div class="cnt" id="cn"></div>
 <div class="bar"><i id="pb"></i></div>
 <p id="er" style="margin-top:10px;color:#dc2626"></p>
 <button id="snap" style="margin-top:12px;display:none">📸 ছবি তুলুন</button>
 <button class="g" id="skip" style="margin-top:auto">🔄 আবার চেষ্টা করুন</button>
</div>

<div class="s c" id="done"><div class="big">🎉</div><h1>অভিনন্দন!</h1><p>আপনি উঠে গেছেন। আজকের দিনটা দারুণ হবে!</p><button id="dh">হোমে ফিরুন</button></div>

<script>
var $=function(i){return document.getElementById(i)};
function show(i){document.querySelectorAll('.s').forEach(function(e){e.classList.remove('on')});$(i).classList.add('on')}
var slides=[["😴","ঘুমের ঘোরে এলার্ম বন্ধ করে দেন?","সাধারণ এলার্ম বন্ধ করে আবার ঘুমিয়ে পড়া খুব সহজ।"],["💪","এখানে টাস্ক না করলে বন্ধ হবে না","পুশ-আপ দিন বা বাথরুমের ট্যাপের ছবি তুলুন।"],["🌅","ঘুম ছুটবে, অলসতাও","উঠে পড়ুন নিজের ইচ্ছায়।"]];
var si=0;
function drawSlide(){var s=slides[si];$('wi').textContent=s[0];$('wt').textContent=s[1];$('wd').textContent=s[2];
 $('dots').innerHTML=slides.map(function(_,j){return '<i class="'+(j===si?'on':'')+'"></i>'}).join('');
 $('wn').textContent=si===slides.length-1?'শুরু করি':'পরের'}
var alarms=[];
try{alarms=JSON.parse(localStorage.getItem('alarms')||'[]')}catch(e){alarms=[]}
function save(){try{localStorage.setItem('alarms',JSON.stringify(alarms))}catch(e){}}
function render(){var L=$('list');
 if(!alarms.length){L.innerHTML='<p style="margin-top:30px;text-align:center">এখনো কোনো এলার্ম নেই</p>';return}
 L.innerHTML=alarms.map(function(a,i){return '<div class="card"><div><div class="t">'+a.t+'</div><div class="sub">'+(a.k==='pushup'?'💪 ১০টা পুশ-আপ':'🚰 ট্যাপের ছবি')+'</div></div><button class="g" data-d="'+i+'">মুছুন</button></div>'}).join('')}
var kind='pushup';
setTimeout(function(){var seen=false;try{seen=localStorage.getItem('seen')}catch(e){}
 if(seen){render();show('home')}else{drawSlide();show('welcome')}},1800);
$('wn').onclick=function(){if(si<slides.length-1){si++;drawSlide()}else{try{localStorage.setItem('seen','1')}catch(e){}render();show('home')}};
$('add').onclick=function(){show('new')};
$('cx').onclick=function(){show('home')};
document.querySelectorAll('.opt').forEach(function(o){o.onclick=function(){document.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on')});o.classList.add('on');kind=o.dataset.k}});
$('sv').onclick=function(){alarms.push({t:$('tm').value,k:kind});save();render();show('home')};
$('list').onclick=function(e){var d=e.target.dataset.d;if(d!==undefined){alarms.splice(+d,1);save();render()}};

// ---- এলার্ম বাজানো ----
var ac=null,beepT=null,stream=null,loopT=null,curKind='pushup',ringing=false,fired='';
document.addEventListener('click',function(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()});
function beep(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.25)}
function startRing(a){if(ringing)return;ringing=true;curKind=a.k;$('rt').textContent=a.t;
 $('rd').textContent=a.k==='pushup'?'বন্ধ করতে ১০টা পুশ-আপ দিন':'বন্ধ করতে বাথরুমের ট্যাপের ছবি তুলুন';
 show('ring');beep();beepT=setInterval(function(){beep();try{navigator.vibrate&&navigator.vibrate(400)}catch(e){}},700)}
function stopRing(){clearInterval(beepT);try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
setInterval(function(){var d=new Date(),hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
 if(hm===fired||ringing)return;
 for(var i=0;i<alarms.length;i++){if(alarms[i].t===hm){fired=hm;startRing(alarms[i]);break}}},1000);
$('test').onclick=function(){var a=alarms[0]||{t:'এখন',k:'pushup'};setTimeout(function(){startRing(a)},5000);$('test').textContent='৫ সেকেন্ড অপেক্ষা করুন...'};

// ---- টাস্ক ----
function stopCam(){clearInterval(loopT);if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
function finish(){stopCam();stopRing();ringing=false;show('done')}
$('rb').onclick=function(){stopCam();show('task');$('er').textContent='';
 var push=curKind==='pushup';
 $('tk').textContent=push?'💪 ১০টা পুশ-আপ দিন':'🚰 ট্যাপের ছবি তুলুন';
 $('tp').textContent=push?'ফোন মেঝেতে উপরের দিকে ক্যামেরা করে রাখুন, তার ওপরে পুশ-আপ দিন।':'বাথরুমে গিয়ে চালু ট্যাপের লাইভ ছবি তুলুন।';
 $('snap').style.display=push?'none':'block';$('cn').textContent=push?'0 / 10':'';$('pb').style.width='0';
 $('vd').className=push?'':'env';
 if(!navigator.mediaDevices){$('er').textContent='এই ব্রাউজারে ক্যামেরা চলছে না।';return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:push?'user':'environment'},audio:false}).then(function(st){
  stream=st;$('vd').srcObject=st;if(push)startPush()}).catch(function(){$('er').textContent='ক্যামেরার অনুমতি পাওয়া যায়নি। ব্রাউজারের সেটিংসে ক্যামেরা চালু করুন।'})};
$('snap').onclick=function(){if(!stream){$('er').textContent='আগে ক্যামেরা চালু করুন।';return}finish()};
$('skip').onclick=function(){$('rb').onclick()};
$('dh').onclick=function(){render();show('home')};

// ---- পুশ-আপ গোনা (ক্যামেরার আলোর পরিবর্তন দেখে) ----
function startPush(){var cv=document.createElement('canvas');cv.width=24;cv.height=18;var cx=cv.getContext('2d',{willReadFrequently:true});
 var v=null,hi=0,lo=255,st='up',n=0;
 loopT=setInterval(function(){var vd=$('vd');if(!vd.videoWidth)return;
  cx.drawImage(vd,0,0,24,18);var d=cx.getImageData(0,0,24,18).data,sum=0;
  for(var i=0;i<d.length;i+=4)sum+=(d[i]+d[i+1]+d[i+2])/3;var m=sum/(d.length/4);
  v=v===null?m:v*.6+m*.4;if(hi===0){hi=v;lo=v}
  hi=Math.max(v,hi-.15);lo=Math.min(v,lo+.15);var r=hi-lo;
  if(r>15){if(st==='up'&&v<lo+r*.3)st='down';else if(st==='down'&&v>hi-r*.3){st='up';n++;$('cn').textContent=n+' / 10';$('pb').style.width=(n*10)+'%';beep();if(n>=10)finish()}}
 },100)}
</script>
</body>
</html>
